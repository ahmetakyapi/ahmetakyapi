<style>
.sans{font-family:'Inter','SF Pro Display','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.serif{font-family:'Instrument Serif','Playfair Display','Iowan Old Style',Georgia,'Times New Roman',serif;font-style:italic;font-weight:400}
.mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.12em}
.rise{animation:rise 1.1s cubic-bezier(.16,1,.3,1) both}
.rise-xl{animation:rise-xl 1.3s cubic-bezier(.16,1,.3,1) both}
.fade{animation:fade 1s ease both}
.fade-up{animation:fade-up 1s cubic-bezier(.16,1,.3,1) both}
.draw-x{transform-box:fill-box;transform-origin:0 50%;animation:draw-x 1.4s cubic-bezier(.76,0,.24,1) both}
.draw-y{transform-box:fill-box;transform-origin:50% 0;animation:draw-y 1.4s cubic-bezier(.76,0,.24,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .9s cubic-bezier(.16,1,.3,1) both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes rise{from{transform:translateY(80px)}}
@keyframes rise-xl{from{transform:translateY(260px)}}
@keyframes fade{from{opacity:0}}
@keyframes fade-up{from{opacity:0;transform:translateY(24px)}}
@keyframes draw-x{from{transform:scaleX(0)}}
@keyframes draw-y{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
