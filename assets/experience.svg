<title>Experience at Nar Sistem Teknoloji (energy): AI Developer, 2026–now; Full-Stack Developer, 2024–2026; Frontend Developer, 2021–2023. Plus R&amp;D and TÜBİTAK projects. Research, design QA, tests and copy run on AI agents I built.</title>
<defs>
<clipPath id="card"><rect width="1200" height="600" rx="28"/></clipPath>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
